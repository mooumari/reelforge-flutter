name: fluttermotion_json
description: Describe a FlutterMotion composition in JSON and build it at runtime.
version: 0.1.0
publish_to: none # until the licensor entity and pub.dev strategy are settled

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  fluttermotion:
    path: ../fluttermotion
  fluttermotion_kit:
    path: ../fluttermotion_kit
  fluttermotion_schema:
    path: ../fluttermotion_schema

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
