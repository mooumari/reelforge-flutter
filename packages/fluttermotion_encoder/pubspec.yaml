name: fluttermotion_encoder
description: On-device video encoding and decoding for FlutterMotion, so a Flutter app can export video with no ffmpeg.
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  fluttermotion: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FluttermotionEncoderPlugin
      macos:
        pluginClass: FluttermotionEncoderPlugin

