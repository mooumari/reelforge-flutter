name: reelforge_encoder
description: On-device video encoding and decoding for ReelForge, so a Flutter app can export video with no ffmpeg.
version: 0.1.0
repository: https://github.com/mooumari/reelforge

# Held back from the first release. On-device export is the one thing this
# project does that nothing else does, and its terms are the open question;
# publishing it under the same licence as the rest would answer that
# question permanently and by accident. Remove this line to release it.
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  reelforge: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.reelforge.reelforge_encoder
        pluginClass: ReelForgeEncoderPlugin
      ios:
        pluginClass: ReelForgeEncoderPlugin
      macos:
        pluginClass: ReelForgeEncoderPlugin

